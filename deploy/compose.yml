name: demo-app

services:
  app:
    image: ${IMAGE_REF:?IMAGE_REF is required}
    container_name: demo-app
    restart: unless-stopped
    init: true
    expose:
      - "3000"
    environment:
      PORT: "3000"
      NAME: production
    labels:
      logging: alloy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - observability

  nginx:
    image: nginx:alpine
    container_name: demo-app-nginx
    restart: unless-stopped
    init: true
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      logging: alloy
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=32m
      - /var/run:rw,noexec,nosuid,size=4m
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --output-document=/dev/null http://127.0.0.1/nginx-health || exit 1
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - observability

networks:
  observability:
    external: true
    name: demo-app-observability
