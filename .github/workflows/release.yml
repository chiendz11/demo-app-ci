name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  verify-release:
    name: Verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Validate semantic version tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Validate production Compose
        env:
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/demo-app:validation
        run: docker compose -f deploy/compose.yml config --quiet

      - name: Validate Nginx configuration
        run: |
          docker run --rm \
            --add-host demo-app:127.0.0.1 \
            --volume "$PWD/deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine \
            nginx -t

  build-image:
    name: Build and publish release image
    needs: verify-release

    permissions:
      contents: read
      packages: write

    uses: ./.github/workflows/reusable-build.yml

    with:
      image_name: ghcr.io/${{ github.repository_owner }}/demo-app
      image_tag: ${{ github.ref_name }}
      push_image: true
      push_latest: true

    secrets: inherit

  sign-release-image:
    name: Keyless sign release image
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign immutable release image
        env:
          IMAGE_DIGEST_REF: ${{ needs.build-image.outputs.image_digest_ref }}
        run: |
          set -euo pipefail

          : "${IMAGE_DIGEST_REF:?image_digest_ref is required}"
          cosign sign --yes "$IMAGE_DIGEST_REF"

      - name: Write signed release metadata
        env:
          IMAGE_DIGEST_REF: ${{ needs.build-image.outputs.image_digest_ref }}
        run: |
          set -euo pipefail

          install -d "$RUNNER_TEMP/signed-release-image"

          jq -n \
            --arg image_digest_ref "$IMAGE_DIGEST_REF" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_sha "$GITHUB_SHA" \
            --arg source_ref "$GITHUB_REF" \
            --arg signer_identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            '{
              schema_version: 1,
              image_digest_ref: $image_digest_ref,
              repository: $repository,
              source_sha: $source_sha,
              source_ref: $source_ref,
              signer_identity: $signer_identity
            }' > "$RUNNER_TEMP/signed-release-image/signed-image.json"

      - name: Upload signed release metadata
        uses: actions/upload-artifact@v7
        with:
          name: signed-release-image-${{ github.ref_name }}
          path: ${{ runner.temp }}/signed-release-image/signed-image.json
          if-no-files-found: error
          retention-days: 7

  create-release:
    name: Create GitHub Release
    needs: sign-release-image
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Create release with generated notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-production:
    name: Deploy to production
    needs:
      - sign-release-image
      - create-release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      actions: read
      contents: read
      packages: read
      id-token: write

    environment:
      name: production

    concurrency:
      group: demo-app-production
      cancel-in-progress: false

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      APPLICATION_URL: ${{ vars.APPLICATION_URL }}

    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v5

      - name: Download signed release metadata
        uses: actions/download-artifact@v8
        with:
          name: signed-release-image-${{ github.ref_name }}
          path: ${{ runner.temp }}/signed-release-image

      - name: Validate signed release metadata
        id: image
        shell: bash
        env:
          METADATA_PATH: ${{ runner.temp }}/signed-release-image/signed-image.json
          EXPECTED_SIGNER_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          set -euo pipefail

          test -s "$METADATA_PATH"

          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_sha "$GITHUB_SHA" \
            --arg source_ref "$GITHUB_REF" \
            --arg signer_identity "$EXPECTED_SIGNER_IDENTITY" \
            '.schema_version == 1 and
             .repository == $repository and
             .source_sha == $source_sha and
             .source_ref == $source_ref and
             .signer_identity == $signer_identity and
             (.image_digest_ref | type == "string")' \
            "$METADATA_PATH" >/dev/null

          digest_ref="$(jq -r '.image_digest_ref' "$METADATA_PATH")"

          if [[ ! "$digest_ref" =~ ^ghcr\.io/${GITHUB_REPOSITORY_OWNER}/demo-app@sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid image digest reference: $digest_ref" >&2
            exit 1
          fi

          echo "digest_ref=${digest_ref}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_REF=${digest_ref}" >> "$GITHUB_ENV"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release image signature
        env:
          IMAGE_DIGEST_REF: ${{ steps.image.outputs.digest_ref }}
        run: |
          set -euo pipefail

          cosign verify \
            --certificate-identity \
            "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer \
            "https://token.actions.githubusercontent.com" \
            "$IMAGE_DIGEST_REF"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: demo-app-deploy-${{ github.run_id }}

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          : "${AWS_REGION:?AWS_REGION is required}"
          : "${INSTANCE_ID:?EC2_INSTANCE_ID is required}"
          : "${APPLICATION_URL:?APPLICATION_URL is required}"
          : "${IMAGE_REF:?IMAGE_REF is required}"

          test -s deploy/compose.yml
          test -s deploy/nginx/default.conf

          aws sts get-caller-identity

      - name: Deploy release through SSM
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          compose_b64="$(base64 --wrap=0 deploy/compose.yml)"
          nginx_b64="$(base64 --wrap=0 deploy/nginx/default.conf)"

          parameters="$(
            jq -cn \
              --arg image "$IMAGE_REF" \
              --arg compose "$compose_b64" \
              --arg nginx "$nginx_b64" \
              '{
              commands: [
                "set -eu",
                "docker network inspect demo-app-observability >/dev/null",
                "install -d -m 0755 /opt/demo-app/nginx",
                "[ ! -f /opt/demo-app/compose.yml ] || cp /opt/demo-app/compose.yml /opt/demo-app/compose.yml.previous",
                "[ ! -f /opt/demo-app/nginx/default.conf ] || cp /opt/demo-app/nginx/default.conf /opt/demo-app/nginx/default.conf.previous",
                ("printf %s " + ($compose | @sh) + " | base64 -d > /opt/demo-app/compose.yml"),
                ("printf %s " + ($nginx | @sh) + " | base64 -d > /opt/demo-app/nginx/default.conf"),
                "cd /opt/demo-app",
                "if [ -s .env ]; then cp .env .env.previous; else previous_image=$(docker inspect --format={{.Config.Image}} demo-app 2>/dev/null || true); if [ -n \"$previous_image\" ]; then printf \"IMAGE_REF=%s\\n\" \"$previous_image\" > .env.previous; else rm -f .env.previous; fi; fi",
                ("printf \"IMAGE_REF=%s\\n\" " + ($image | @sh) + " > .env"),
                "docker compose --env-file .env config --quiet",
                "docker compose --env-file .env pull",
                "docker run --rm --add-host demo-app:127.0.0.1 --volume /opt/demo-app/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro nginx:alpine nginx -t",
                "touch .deployment-in-progress",
                "docker compose --env-file .env down --remove-orphans >/dev/null 2>&1 || true",
                "docker rm -f demo-app demo-app-nginx >/dev/null 2>&1 || true",
                "systemctl disable --now nginx >/dev/null 2>&1 || true",
                "docker compose --env-file .env up -d --remove-orphans",
                "attempt=0; until [ \"$(docker inspect --format={{.State.Health.Status}} demo-app)\" = healthy ]; do attempt=$((attempt + 1)); [ \"$attempt\" -lt 31 ] || exit 1; sleep 2; done",
                "attempt=0; until [ \"$(docker inspect --format={{.State.Health.Status}} demo-app-nginx)\" = healthy ]; do attempt=$((attempt + 1)); [ \"$attempt\" -lt 31 ] || exit 1; sleep 2; done",
                "curl --fail --silent --show-error http://127.0.0.1:8080/health"
              ]
            }'
          )"

          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Deploy ${IMAGE_REF}" \
              --parameters "$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"

          echo "command_id=${command_id}" >> "$GITHUB_OUTPUT"
          echo "SSM command: ${command_id}"

      - name: Wait for SSM deployment
        shell: bash
        run: |
          set -euo pipefail

          aws ssm wait command-executed \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "$INSTANCE_ID"

      - name: Show SSM deployment output
        if: always() && steps.deploy.outputs.command_id != ''
        shell: bash
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "$INSTANCE_ID" \
            --query '{
              Status:Status,
              StandardOutput:StandardOutputContent,
              StandardError:StandardErrorContent
            }'

      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error \
              "${APPLICATION_URL%/}/health"; then
              echo
              echo "Production health check passed"
              exit 0
            fi

            echo "Health check attempt ${attempt}/18 failed"
            sleep 10
          done

          echo "Production health check failed"
          exit 1

      - name: Roll back failed deployment
        if: failure() && steps.deploy.outputs.command_id != ''
        shell: bash
        run: |
          set -euo pipefail

          parameters="$(
            jq -cn '{
              commands: [
                "set -eu",
                "cd /opt/demo-app",
                "if [ ! -f .deployment-in-progress ]; then [ ! -s .env.previous ] || cp .env.previous .env; [ ! -f compose.yml.previous ] || cp compose.yml.previous compose.yml; [ ! -f nginx/default.conf.previous ] || cp nginx/default.conf.previous nginx/default.conf; exit 0; fi",
                "docker compose --env-file .env down --remove-orphans >/dev/null 2>&1 || true",
                "[ ! -f compose.yml.previous ] || cp compose.yml.previous compose.yml",
                "[ ! -f nginx/default.conf.previous ] || cp nginx/default.conf.previous nginx/default.conf",
                "if [ -s .env.previous ]; then cp .env.previous .env; docker compose --env-file .env config --quiet; docker compose --env-file .env pull; docker compose --env-file .env up -d --remove-orphans; attempt=0; until [ \"$(docker inspect --format={{.State.Health.Status}} demo-app)\" = healthy ] && [ \"$(docker inspect --format={{.State.Health.Status}} demo-app-nginx)\" = healthy ]; do attempt=$((attempt + 1)); [ \"$attempt\" -lt 31 ] || exit 1; sleep 2; done; curl --fail --silent --show-error http://127.0.0.1:8080/health; else docker rm -f demo-app demo-app-nginx >/dev/null 2>&1 || true; systemctl enable --now nginx; fi",
                "rm -f .deployment-in-progress"
              ]
            }'
          )"

          rollback_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Rollback failed demo-app deployment" \
              --parameters "$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"

          aws ssm wait command-executed \
            --command-id "$rollback_id" \
            --instance-id "$INSTANCE_ID"

      - name: Clean up previous deployment
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          parameters="$(
            jq -cn '{
              commands: [
                "cd /opt/demo-app",
                "rm -f .env.previous compose.yml.previous nginx/default.conf.previous .deployment-in-progress",
                "docker image prune -f"
              ]
            }'
          )"

          cleanup_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Clean up previous demo-app release" \
              --parameters "$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"

          aws ssm wait command-executed \
            --command-id "$cleanup_id" \
            --instance-id "$INSTANCE_ID"

      - name: Write deployment summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Production deployment"
            echo ""
            echo "- Release: \`${GITHUB_REF_NAME}\`"
            echo "- Image: \`${IMAGE_REF}\`"
            echo "- Instance: \`${INSTANCE_ID}\`"
            echo "- URL: ${APPLICATION_URL}"
            echo "- Traffic: ALB → Nginx → demo-app"
            echo "- Status: successful"
          } >> "$GITHUB_STEP_SUMMARY"
