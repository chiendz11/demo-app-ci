name: Reusable Docker Build

on:
  workflow_call:
    inputs:
      image_name:
        description: Docker image name
        required: true
        type: string

      image_tag:
        description: Docker image tag
        required: true
        type: string

      push_image:
        description: Push the tagged image to the registry after security checks
        required: false
        default: false
        type: boolean

      push_latest:
        description: Also push the image using the latest tag
        required: false
        default: false
        type: boolean

    outputs:
      image_ref:
        description: Fully qualified image reference produced by the workflow
        value: ${{ jobs.build.outputs.image_ref }}

      image_digest_ref:
        description: Immutable image reference produced after pushing to the registry
        value: ${{ jobs.build.outputs.image_digest_ref }}

jobs:
  build:
    name: Build, scan, SBOM, and optionally push image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      image_ref: ${{ steps.image.outputs.ref }}
      image_digest_ref: ${{ steps.digest.outputs.ref }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Prepare image metadata
        id: image
        shell: bash
        run: |
          image_ref="${{ inputs.image_name }}:${{ inputs.image_tag }}"

          echo "ref=${image_ref}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

          echo "Image: ${image_ref}"
          echo "Push image: ${{ inputs.push_image }}"
          echo "Push latest: ${{ inputs.push_latest }}"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          load: true
          tags: |
            ${{ inputs.image_name }}:${{ inputs.image_tag }}
            ${{ inputs.image_name }}:latest
          build-args: |
            BUILD_DATE=${{ steps.image.outputs.build_date }}
            VERSION=${{ inputs.image_tag }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate and upload SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ inputs.image_name }}:${{ inputs.image_tag }}
          format: spdx-json
          artifact-name: sbom-${{ inputs.image_tag }}.spdx.json
          upload-artifact: true

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ inputs.image_name }}:${{ inputs.image_tag }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Login to GHCR
        if: inputs.push_image
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: inputs.push_image
        shell: bash
        run: |
          set -euo pipefail

          docker push "${{ inputs.image_name }}:${{ inputs.image_tag }}"

          if [[ "${{ inputs.push_latest }}" == "true" ]]; then
            docker push "${{ inputs.image_name }}:latest"
          fi

      - name: Resolve immutable image digest
        if: inputs.push_image
        id: digest
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail

          digest="$(
            docker buildx imagetools inspect "$IMAGE_REF" \
              --format '{{json .Manifest.Digest}}' |
              tr -d '"'
          )"

          digest_ref="${IMAGE_REF%:*}@${digest}"

          echo "ref=${digest_ref}" >> "$GITHUB_OUTPUT"
          echo "Immutable image: ${digest_ref}"
