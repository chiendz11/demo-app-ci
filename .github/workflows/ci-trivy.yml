name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test:
    name: Test - Node ${{ matrix.node }} / ${{ matrix.os }}
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
        os: [ubuntu-22.04, ubuntu-24.04]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Display environment info
        run: |
          echo "Running tests on Node.js version: $(node -v)"
          echo "Running tests on npm version: $(npm -v)"
          echo "Running tests on OS: ${{ matrix.os }}"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  deployment-config:
    name: Validate Nginx and production Compose
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Validate production Compose
        env:
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/demo-app:validation
        run: docker compose -f deploy/compose.yml config --quiet

      - name: Validate Nginx configuration
        run: |
          docker run --rm \
            --add-host demo-app:127.0.0.1 \
            --volume "$PWD/deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine \
            nginx -t

  docker:
    name: Call reusable Docker build
    needs:
      - test
      - deployment-config

    permissions:
      contents: read
      packages: write

    uses: ./.github/workflows/reusable-build.yml

    with:
      image_name: ghcr.io/${{ github.repository_owner }}/demo-app
      image_tag: sha-${{ github.sha }}
      push_image: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      push_latest: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    secrets: inherit

  sign-image:
    name: Keyless sign image
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign immutable image
        env:
          IMAGE_DIGEST_REF: ${{ needs.docker.outputs.image_digest_ref }}
        run: |
          set -euo pipefail

          : "${IMAGE_DIGEST_REF:?image_digest_ref is required}"
          cosign sign --yes "$IMAGE_DIGEST_REF"

      - name: Write signed image metadata
        env:
          IMAGE_DIGEST_REF: ${{ needs.docker.outputs.image_digest_ref }}
        run: |
          set -euo pipefail

          install -d "$RUNNER_TEMP/signed-image"

          jq -n \
            --arg image_digest_ref "$IMAGE_DIGEST_REF" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_sha "$GITHUB_SHA" \
            --arg source_ref "$GITHUB_REF" \
            --arg signer_identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci-trivy.yml@${GITHUB_REF}" \
            '{
              schema_version: 1,
              image_digest_ref: $image_digest_ref,
              repository: $repository,
              source_sha: $source_sha,
              source_ref: $source_ref,
              signer_identity: $signer_identity
            }' > "$RUNNER_TEMP/signed-image/signed-image.json"

      - name: Upload signed image metadata
        uses: actions/upload-artifact@v7
        with:
          name: signed-image-${{ github.sha }}
          path: ${{ runner.temp }}/signed-image/signed-image.json
          if-no-files-found: error
          retention-days: 7
